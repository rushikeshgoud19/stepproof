name: tests

# A library that checks whether things actually happened should be able to show that
# its own checks actually ran. This workflow is the repo practising what it sells.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; test the floor and the ceiling, since
        # the union syntax (`str | None`) and `dataclass` behaviour differ across them.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step and no dependencies on purpose. If this job ever needs a
      # `pip install`, the core has grown a dependency and the pitch is no longer true.
      - name: Assert the core is dependency-free
        run: python -c "import stepproof, sys; assert not [m for m in sys.modules if m.split('.')[0] in ('langchain','openai','crewai','pydantic','requests')], 'core pulled in a third-party module'; print('core is dependency-free, version', stepproof.__version__)"

      - name: Core, ledger and tamper detection
        run: python tests/test_stepproof.py

      - name: Collectors and clause grammar
        run: python tests/test_collectors_and_adapter.py

      - name: Adapters (LangChain / OpenAI Agents / CrewAI)
        run: python tests/test_adapters.py

      - name: Freshness, dir, json and shell collectors
        run: python tests/test_collectors_extra.py

      - name: Capability seams
        run: python tests/test_seams.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build twine
          python -m build

      - name: Validate package metadata
        # Catches a broken README or bad metadata BEFORE an upload burns a version
        # number — PyPI never lets you reuse one.
        run: python -m twine check dist/*

      - name: Install the built wheel in a clean env and catch a fake success
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --quiet dist/*.whl
          /tmp/fresh/bin/python -c "
          from stepproof import verified, VerificationError
          import tempfile, os
          target = os.path.join(tempfile.mkdtemp(), 'never_written.txt')

          @verified(proves='file exists at {path}')
          def claims_success(path):
              return 'Report written successfully.'

          try:
              claims_success(target)
              raise SystemExit('FAIL: the fake success was not caught')
          except VerificationError as e:
              print('caught as expected:', str(e)[:100])
          "
