[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stepproof"
version = "0.1.0"
description = "Prove what your agent actually did — step-level verification and a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: an SPDX expression, NOT the legacy free-text field. Emitting `License: MIT`
# alongside a "License :: OSI Approved" classifier makes PyPI reject the upload with a bare
# `400 Bad Request` — the two are mutually exclusive under Metadata 2.4, and the error says
# nothing about which field is at fault. Hence: expression here, classifier deleted below.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rushikesh Goud" }]
keywords = ["agents", "llm", "verification", "audit", "observability", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# The core is deliberately dependency-free: it must be droppable into any agent stack,
# and an audit tool that drags in a framework is an audit tool nobody installs.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "langchain-openai>=0.2"]

[project.urls]
Homepage = "https://github.com/rushikeshgoud19/stepproof"

[tool.hatch.build.targets.wheel]
packages = ["stepproof"]
